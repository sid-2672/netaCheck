repos:
  # ---------------------------------------------------------------------------
  # Python — standard pre-commit hooks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]
      - id: check-docstring-first
      - id: debug-statements

  # ---------------------------------------------------------------------------
  # Python — Black formatter
  # ---------------------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12
        args: [--line-length=100]
        files: ^backend/

  # ---------------------------------------------------------------------------
  # Python — Ruff linter + isort
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ---------------------------------------------------------------------------
  # Python — Mypy type checker
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        files: ^backend/src/
        additional_dependencies:
          - pydantic>=2.10
          - pydantic-settings>=2.7
          - sqlalchemy[mypy]>=2.0
          - types-beautifulsoup4
          - types-python-dateutil
          - types-aiofiles

  # ---------------------------------------------------------------------------
  # Security — check for known vulnerabilities in dependencies
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [--config, backend/pyproject.toml, -r, backend/src/]
        files: ^backend/src/

  # ---------------------------------------------------------------------------
  # Secrets — prevent accidental secret commits
  # ---------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: .env.example|alembic/versions/

  # ---------------------------------------------------------------------------
  # Frontend — ESLint
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: bash -c 'cd frontend && npx eslint --max-warnings 0 src/'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      - id: prettier
        name: Prettier
        entry: bash -c 'cd frontend && npx prettier --check src/'
        language: system
        files: ^frontend/src/.*\.(ts|tsx|css)$
        pass_filenames: false
